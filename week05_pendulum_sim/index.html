<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>双摆模拟器 - Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #8888aa;
  }
  canvas {
    display: block;
    border-radius: 8px;
    cursor: grab;
  }
  canvas:active { cursor: grabbing; }
  .info {
    position: fixed;
    bottom: 20px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.5;
  }
  .controls {
    position: fixed;
    bottom: 48px;
    display: flex;
    gap: 28px;
    align-items: flex-end;
    background: rgba(30, 30, 46, 0.85);
    border: 1px solid rgba(100, 100, 140, 0.15);
    border-radius: 8px;
    padding: 14px 24px;
    backdrop-filter: blur(6px);
  }
  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .control-group label {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: #6a6a8a;
  }
  .control-group .value {
    font-size: 12px;
    color: #88aaff;
    min-width: 48px;
    text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 110px;
    height: 4px;
    background: rgba(100, 100, 140, 0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4a9eff;
    border: 2px solid #1a1a24;
    box-shadow: 0 0 6px rgba(74, 158, 255, 0.5);
  }
  .reset-btn {
    background: rgba(74, 158, 255, 0.12);
    border: 1px solid rgba(74, 158, 255, 0.3);
    color: #88aaff;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .reset-btn:hover {
    background: rgba(74, 158, 255, 0.22);
  }
  .scenes {
    position: fixed;
    bottom: 110px;
    display: flex;
    gap: 10px;
  }
  .scene-btn {
    background: rgba(40, 40, 60, 0.8);
    border: 1px solid rgba(100, 100, 140, 0.2);
    color: #8888aa;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    padding: 6px 18px;
    border-radius: 20px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s;
  }
  .scene-btn:hover {
    border-color: rgba(74, 158, 255, 0.4);
    color: #aabbff;
  }
  .scene-btn.active {
    background: rgba(74, 158, 255, 0.18);
    border-color: rgba(74, 158, 255, 0.5);
    color: #88aaff;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="scenes">
  <button class="scene-btn" data-scene="earth" onclick="applyScene('earth')"> 地球</button>
  <button class="scene-btn" data-scene="moon" onclick="applyScene('moon')">🌙 月球</button>
  <button class="scene-btn" data-scene="jupiter" onclick="applyScene('jupiter')">🟤 木星</button>
  <button class="scene-btn" data-scene="space" onclick="applyScene('space')">🌌 太空</button>
</div>
<div class="controls">
  <div class="control-group">
    <label>摆长 L (px)</label>
    <input type="range" id="sliderL" min="60" max="200" value="150" step="1">
    <span class="value" id="valL">150</span>
  </div>
  <div class="control-group">
    <label>重力 g</label>
    <input type="range" id="sliderG" min="0.1" max="25" value="9.8" step="0.1">
    <span class="value" id="valG">9.8</span>
  </div>
  <div class="control-group">
    <label>阻尼</label>
    <input type="range" id="sliderD" min="0" max="0.01" value="0.001" step="0.001">
    <span class="value" id="valD">0.001</span>
  </div>
  <button class="reset-btn" onclick="resetAnimation()">重置摆动</button>
</div>
<div class="info">双摆模拟器 · 沙雨桐 · 7904126049</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = 600;
canvas.height = 500;

const PIVOT = { x: canvas.width / 2, y: 60 };
let L = 150;
let G = 9.8;
let targetG = 9.8;
const SCALE = 0.04;
let DAMPING = 0.999;
const BOB_RADIUS = 14;

let theta1 = Math.PI * 0.75;
let omega1 = 0;
let theta2 = Math.PI * 0.75;
let omega2 = 0;

let state = [theta1, omega1, theta2, omega2];

let trail = [];
const MAX_TRAIL = 300;

let dragging = null;
let lastTime = null;

function derivatives(s) {
  const t1 = s[0], w1 = s[1], t2 = s[2], w2 = s[3];
  const dt = t1 - t2;
  const sinDt = Math.sin(dt);
  const cosDt = Math.cos(dt);
  const sin2Dt = Math.sin(2 * dt);
  const denom = 2 - cosDt * cosDt;

  const a1 = (-G * (2 * Math.sin(t1) - Math.sin(t2) * cosDt)
    - w2 * w2 * L * sinDt
    - w1 * w1 * L * sin2Dt * 0.5) / (L * SCALE * denom);

  const a2 = (2 * sinDt * (w1 * w1 * L * 2
    + G * Math.cos(t1) * 2
    + w2 * w2 * L * cosDt)) / (L * SCALE * 2 * denom);

  return [w1, a1, w2, a2];
}

function rk4Step(s, dt) {
  const k1 = derivatives(s);
  const s2 = s.map((v, i) => v + k1[i] * dt * 0.5);
  const k2 = derivatives(s2);
  const s3 = s.map((v, i) => v + k2[i] * dt * 0.5);
  const k3 = derivatives(s3);
  const s4 = s.map((v, i) => v + k3[i] * dt);
  const k4 = derivatives(s4);
  return s.map((v, i) => v + (k1[i] + 2 * k2[i] + 2 * k3[i] + k4[i]) * dt / 6);
}

function update(dt) {
  G += (targetG - G) * 0.05;
  const steps = 8;
  const subDt = Math.min(dt / steps, 0.004);
  for (let i = 0; i < steps; i++) {
    state = rk4Step(state, subDt);
    state[1] *= DAMPING;
    state[3] *= DAMPING;
  }
  theta1 = state[0];
  omega1 = state[1];
  theta2 = state[2];
  omega2 = state[3];
}

function getPositions() {
  const x1 = PIVOT.x + L * Math.sin(theta1);
  const y1 = PIVOT.y + L * Math.cos(theta1);
  const x2 = x1 + L * Math.sin(theta2);
  const y2 = y1 + L * Math.cos(theta2);
  return { x1, y1, x2, y2 };
}

function trailHue(index, total) {
  return (index / total) * 360;
}

function drawBackground() {
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(100, 100, 140, 0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawTrail(pos) {
  trail.push({ x: pos.x2, y: pos.y2 });
  if (trail.length > MAX_TRAIL) trail.shift();

  for (let i = 1; i < trail.length; i++) {
    const t = i / trail.length;
    const hue = trailHue(i, trail.length);
    const alpha = t * 0.7;
    ctx.beginPath();
    ctx.strokeStyle = `hsla(${hue}, 85%, 60%, ${alpha})`;
    ctx.lineWidth = 1.5 + t * 1.5;
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
}

function drawPendulum(pos) {
  ctx.beginPath();
  ctx.moveTo(PIVOT.x, PIVOT.y);
  ctx.lineTo(pos.x1, pos.y1);
  ctx.strokeStyle = 'rgba(180, 180, 210, 0.6)';
  ctx.lineWidth = 2;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(pos.x1, pos.y1);
  ctx.lineTo(pos.x2, pos.y2);
  ctx.strokeStyle = 'rgba(180, 180, 210, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const glow1 = ctx.createRadialGradient(pos.x1, pos.y1, 0, pos.x1, pos.y1, BOB_RADIUS * 2.5);
  glow1.addColorStop(0, 'rgba(100, 180, 255, 0.2)');
  glow1.addColorStop(1, 'rgba(100, 180, 255, 0)');
  ctx.beginPath();
  ctx.arc(pos.x1, pos.y1, BOB_RADIUS * 2.5, 0, Math.PI * 2);
  ctx.fillStyle = glow1;
  ctx.fill();

  const grad1 = ctx.createRadialGradient(
    pos.x1 - BOB_RADIUS * 0.3, pos.y1 - BOB_RADIUS * 0.3, BOB_RADIUS * 0.1,
    pos.x1, pos.y1, BOB_RADIUS
  );
  grad1.addColorStop(0, '#c0e0ff');
  grad1.addColorStop(0.6, '#4a9eff');
  grad1.addColorStop(1, '#2266cc');
  ctx.beginPath();
  ctx.arc(pos.x1, pos.y1, BOB_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad1;
  ctx.fill();

  const glow2 = ctx.createRadialGradient(pos.x2, pos.y2, 0, pos.x2, pos.y2, BOB_RADIUS * 3);
  glow2.addColorStop(0, 'rgba(255, 100, 180, 0.2)');
  glow2.addColorStop(1, 'rgba(255, 100, 180, 0)');
  ctx.beginPath();
  ctx.arc(pos.x2, pos.y2, BOB_RADIUS * 3, 0, Math.PI * 2);
  ctx.fillStyle = glow2;
  ctx.fill();

  const grad2 = ctx.createRadialGradient(
    pos.x2 - BOB_RADIUS * 0.3, pos.y2 - BOB_RADIUS * 0.3, BOB_RADIUS * 0.1,
    pos.x2, pos.y2, BOB_RADIUS
  );
  grad2.addColorStop(0, '#ffc0e0');
  grad2.addColorStop(0.6, '#ff4a9e');
  grad2.addColorStop(1, '#cc2266');
  ctx.beginPath();
  ctx.arc(pos.x2, pos.y2, BOB_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad2;
  ctx.fill();
}

function drawPivot() {
  ctx.beginPath();
  ctx.arc(PIVOT.x, PIVOT.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#667';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(PIVOT.x - 30, PIVOT.y);
  ctx.lineTo(PIVOT.x + 30, PIVOT.y);
  ctx.strokeStyle = 'rgba(120, 120, 150, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAngles(pos) {
  const d1 = (theta1 * 180 / Math.PI).toFixed(1);
  const d2 = (theta2 * 180 / Math.PI).toFixed(1);
  ctx.fillStyle = 'rgba(100, 180, 255, 0.45)';
  ctx.font = '11px Consolas, monospace';
  ctx.fillText(`θ₁ = ${d1}°`, PIVOT.x + 36, PIVOT.y + 14);
  ctx.fillStyle = 'rgba(255, 100, 180, 0.45)';
  ctx.fillText(`θ₂ = ${d2}°`, pos.x1 + 20, pos.y1 + 4);
}

function draw(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  if (!dragging) update(dt);
  const pos = getPositions();

  drawBackground();
  drawTrail(pos);
  drawPivot();
  drawPendulum(pos);
  drawAngles(pos);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const pos = getPositions();

  const d1 = Math.hypot(mx - pos.x1, my - pos.y1);
  const d2 = Math.hypot(mx - pos.x2, my - pos.y2);

  if (d2 < BOB_RADIUS * 3) {
    dragging = 2;
  } else if (d1 < BOB_RADIUS * 3) {
    dragging = 1;
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!dragging) return;
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  if (dragging === 1) {
    theta1 = Math.atan2(mx - PIVOT.x, my - PIVOT.y);
    omega1 = 0;
    state = [theta1, 0, theta2, 0];
  } else if (dragging === 2) {
    const pos = getPositions();
    theta2 = Math.atan2(mx - pos.x1, my - pos.y1);
    omega2 = 0;
    state = [theta1, omega1, theta2, 0];
  }
  trail = [];
});

canvas.addEventListener('mouseup', () => { dragging = null; });
canvas.addEventListener('mouseleave', () => { dragging = null; });

canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const mx = touch.clientX - rect.left;
  const my = touch.clientY - rect.top;
  const pos = getPositions();

  const d1 = Math.hypot(mx - pos.x1, my - pos.y1);
  const d2 = Math.hypot(mx - pos.x2, my - pos.y2);

  if (d2 < BOB_RADIUS * 4) dragging = 2;
  else if (d1 < BOB_RADIUS * 4) dragging = 1;
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (!dragging) return;
  const touch = e.touches[0];
  const rect = canvas.getBoundingClientRect();
  const mx = touch.clientX - rect.left;
  const my = touch.clientY - rect.top;

  if (dragging === 1) {
    theta1 = Math.atan2(mx - PIVOT.x, my - PIVOT.y);
    omega1 = 0;
    state = [theta1, 0, theta2, 0];
  } else if (dragging === 2) {
    const pos = getPositions();
    theta2 = Math.atan2(mx - pos.x1, my - pos.y1);
    omega2 = 0;
    state = [theta1, omega1, theta2, 0];
  }
  trail = [];
}, { passive: false });

canvas.addEventListener('touchend', () => { dragging = null; });

const sliderL = document.getElementById('sliderL');
const sliderG = document.getElementById('sliderG');
const sliderD = document.getElementById('sliderD');
const valL = document.getElementById('valL');
const valG = document.getElementById('valG');
const valD = document.getElementById('valD');

sliderL.addEventListener('input', () => {
  L = parseFloat(sliderL.value);
  valL.textContent = L;
  saveParams();
});

sliderG.addEventListener('input', () => {
  G = parseFloat(sliderG.value);
  targetG = G;
  valG.textContent = G.toFixed(1);
  document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
  saveParams();
});

sliderD.addEventListener('input', () => {
  const d = parseFloat(sliderD.value);
  DAMPING = 1 - d;
  valD.textContent = d.toFixed(3);
  saveParams();
});

const SCENES = {
  earth:   { g: 9.8,  label: '地球' },
  moon:    { g: 1.6,  label: '月球' },
  jupiter: { g: 24.8, label: '木星' },
  space:   { g: 0.1,  label: '太空' }
};

function applyScene(name) {
  const scene = SCENES[name];
  if (!scene) return;
  targetG = scene.g;
  sliderG.value = scene.g;
  valG.textContent = scene.g.toFixed(1);
  document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
  const active = document.querySelector(`.scene-btn[data-scene="${name}"]`);
  if (active) active.classList.add('active');
  saveParams();
}

function saveParams() {
  const data = {
    L: L,
    G: targetG,
    damping: 1 - DAMPING,
    scene: null
  };
  for (const [key, s] of Object.entries(SCENES)) {
    if (Math.abs(targetG - s.g) < 0.05) { data.scene = key; break; }
  }
  try { localStorage.setItem('pendulum_params', JSON.stringify(data)); } catch (e) {}
}

function loadParams() {
  try {
    const raw = localStorage.getItem('pendulum_params');
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.L != null) { L = data.L; sliderL.value = L; valL.textContent = L; }
    if (data.G != null) { targetG = data.G; G = data.G; sliderG.value = data.G; valG.textContent = data.G.toFixed(1); }
    if (data.damping != null) { DAMPING = 1 - data.damping; sliderD.value = data.damping; valD.textContent = data.damping.toFixed(3); }
    if (data.scene) {
      document.querySelectorAll('.scene-btn').forEach(btn => btn.classList.remove('active'));
      const active = document.querySelector(`.scene-btn[data-scene="${data.scene}"]`);
      if (active) active.classList.add('active');
    }
  } catch (e) {}
}

loadParams();

function resetAnimation() {
  theta1 = Math.PI * 0.75;
  omega1 = 0;
  theta2 = Math.PI * 0.75;
  omega2 = 0;
  state = [theta1, omega1, theta2, omega2];
  trail = [];
}
</script>
</body>
</html>
