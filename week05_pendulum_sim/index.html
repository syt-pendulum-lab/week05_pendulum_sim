<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单摆模拟器 - Week 05</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a24;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Consolas', 'Courier New', monospace;
    color: #8888aa;
  }
  canvas {
    display: block;
    border-radius: 8px;
  }
  .info {
    position: fixed;
    bottom: 20px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: 0.5;
  }
  .controls {
    position: fixed;
    bottom: 48px;
    display: flex;
    gap: 28px;
    align-items: flex-end;
    background: rgba(30, 30, 46, 0.85);
    border: 1px solid rgba(100, 100, 140, 0.15);
    border-radius: 8px;
    padding: 14px 24px;
    backdrop-filter: blur(6px);
  }
  .control-group {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .control-group label {
    font-size: 11px;
    letter-spacing: 0.5px;
    color: #6a6a8a;
  }
  .control-group .value {
    font-size: 12px;
    color: #88aaff;
    min-width: 48px;
    text-align: center;
  }
  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 110px;
    height: 4px;
    background: rgba(100, 100, 140, 0.2);
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: #4a9eff;
    border: 2px solid #1a1a24;
    box-shadow: 0 0 6px rgba(74, 158, 255, 0.5);
  }
  .reset-btn {
    background: rgba(74, 158, 255, 0.12);
    border: 1px solid rgba(74, 158, 255, 0.3);
    color: #88aaff;
    font-family: 'Consolas', 'Courier New', monospace;
    font-size: 12px;
    padding: 6px 16px;
    border-radius: 4px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: background 0.2s;
  }
  .reset-btn:hover {
    background: rgba(74, 158, 255, 0.22);
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div class="controls">
  <div class="control-group">
    <label>摆长 L (px)</label>
    <input type="range" id="sliderL" min="100" max="350" value="200" step="1">
    <span class="value" id="valL">200</span>
  </div>
  <div class="control-group">
    <label>重力 g</label>
    <input type="range" id="sliderG" min="1" max="25" value="9.8" step="0.1">
    <span class="value" id="valG">9.8</span>
  </div>
  <div class="control-group">
    <label>阻尼</label>
    <input type="range" id="sliderD" min="0" max="0.01" value="0.001" step="0.001">
    <span class="value" id="valD">0.001</span>
  </div>
  <button class="reset-btn" id="resetBtn">重置摆动</button>
</div>
<div class="info">单摆模拟器 · 沙雨桐 · 7904126049</div>
<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

canvas.width = 600;
canvas.height = 500;

const PIVOT = { x: canvas.width / 2, y: 80 };
let L = 200;
let G = 9.8;
const SCALE = 0.05;
let DAMPING = 0.999;
const BOB_RADIUS = 18;

let theta = Math.PI / 4;
let omega = 0;
let trail = [];
const MAX_TRAIL = 60;

let lastTime = null;

function update(dt) {
  const steps = 4;
  const subDt = dt / steps;
  for (let i = 0; i < steps; i++) {
    const alpha = -(G / (L * SCALE)) * Math.sin(theta);
    omega += alpha * subDt;
    omega *= DAMPING;
    theta += omega * subDt;
  }
}

function getBobPos() {
  return {
    x: PIVOT.x + L * Math.sin(theta),
    y: PIVOT.y + L * Math.cos(theta)
  };
}

function drawBackground() {
  ctx.fillStyle = '#1a1a24';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.strokeStyle = 'rgba(100, 100, 140, 0.06)';
  ctx.lineWidth = 1;
  for (let x = 0; x < canvas.width; x += 40) {
    ctx.beginPath();
    ctx.moveTo(x, 0);
    ctx.lineTo(x, canvas.height);
    ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += 40) {
    ctx.beginPath();
    ctx.moveTo(0, y);
    ctx.lineTo(canvas.width, y);
    ctx.stroke();
  }
}

function drawTrail(bob) {
  trail.push({ x: bob.x, y: bob.y });
  if (trail.length > MAX_TRAIL) trail.shift();

  for (let i = 1; i < trail.length; i++) {
    const alpha = (i / trail.length) * 0.35;
    ctx.beginPath();
    ctx.strokeStyle = `rgba(100, 180, 255, ${alpha})`;
    ctx.lineWidth = 2;
    ctx.moveTo(trail[i - 1].x, trail[i - 1].y);
    ctx.lineTo(trail[i].x, trail[i].y);
    ctx.stroke();
  }
}

function drawPendulum(bob) {
  ctx.beginPath();
  ctx.moveTo(PIVOT.x, PIVOT.y);
  ctx.lineTo(bob.x, bob.y);
  ctx.strokeStyle = 'rgba(180, 180, 210, 0.7)';
  ctx.lineWidth = 2;
  ctx.stroke();

  const glow = ctx.createRadialGradient(bob.x, bob.y, 0, bob.x, bob.y, BOB_RADIUS * 3);
  glow.addColorStop(0, 'rgba(100, 180, 255, 0.25)');
  glow.addColorStop(0.5, 'rgba(100, 180, 255, 0.06)');
  glow.addColorStop(1, 'rgba(100, 180, 255, 0)');
  ctx.beginPath();
  ctx.arc(bob.x, bob.y, BOB_RADIUS * 3, 0, Math.PI * 2);
  ctx.fillStyle = glow;
  ctx.fill();

  const grad = ctx.createRadialGradient(
    bob.x - BOB_RADIUS * 0.3, bob.y - BOB_RADIUS * 0.3, BOB_RADIUS * 0.1,
    bob.x, bob.y, BOB_RADIUS
  );
  grad.addColorStop(0, '#a0d4ff');
  grad.addColorStop(0.6, '#4a9eff');
  grad.addColorStop(1, '#2266cc');
  ctx.beginPath();
  ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(bob.x, bob.y, BOB_RADIUS, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(100, 180, 255, 0.4)';
  ctx.lineWidth = 1.5;
  ctx.stroke();
}

function drawPivot() {
  ctx.beginPath();
  ctx.arc(PIVOT.x, PIVOT.y, 5, 0, Math.PI * 2);
  ctx.fillStyle = '#667';
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(PIVOT.x - 30, PIVOT.y);
  ctx.lineTo(PIVOT.x + 30, PIVOT.y);
  ctx.strokeStyle = 'rgba(120, 120, 150, 0.5)';
  ctx.lineWidth = 2;
  ctx.stroke();
}

function drawAngleArc() {
  const arcR = 40;
  ctx.beginPath();
  ctx.moveTo(PIVOT.x, PIVOT.y);
  ctx.arc(PIVOT.x, PIVOT.y, arcR, Math.PI / 2 - Math.abs(theta), Math.PI / 2, theta > 0);
  ctx.closePath();
  ctx.fillStyle = 'rgba(100, 180, 255, 0.08)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(PIVOT.x, PIVOT.y, arcR, Math.PI / 2 - Math.abs(theta), Math.PI / 2, theta > 0);
  ctx.strokeStyle = 'rgba(100, 180, 255, 0.3)';
  ctx.lineWidth = 1;
  ctx.stroke();

  const deg = (theta * 180 / Math.PI).toFixed(1);
  ctx.fillStyle = 'rgba(100, 180, 255, 0.5)';
  ctx.font = '11px Consolas, monospace';
  ctx.fillText(`θ = ${deg}°`, PIVOT.x + 12, PIVOT.y + arcR + 16);
}

function draw(timestamp) {
  if (!lastTime) lastTime = timestamp;
  const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
  lastTime = timestamp;

  update(dt);
  const bob = getBobPos();

  drawBackground();
  drawTrail(bob);
  drawAngleArc();
  drawPivot();
  drawPendulum(bob);

  requestAnimationFrame(draw);
}

requestAnimationFrame(draw);

const sliderL = document.getElementById('sliderL');
const sliderG = document.getElementById('sliderG');
const sliderD = document.getElementById('sliderD');
const valL = document.getElementById('valL');
const valG = document.getElementById('valG');
const valD = document.getElementById('valD');
const resetBtn = document.getElementById('resetBtn');

sliderL.addEventListener('input', () => {
  L = parseFloat(sliderL.value);
  valL.textContent = L;
});

sliderG.addEventListener('input', () => {
  G = parseFloat(sliderG.value);
  valG.textContent = G.toFixed(1);
});

sliderD.addEventListener('input', () => {
  const d = parseFloat(sliderD.value);
  DAMPING = 1 - d;
  valD.textContent = d.toFixed(3);
});

resetBtn.addEventListener('click', () => {
  theta = Math.PI / 4;
  omega = 0;
  trail = [];
});
</script>
</body>
</html>
